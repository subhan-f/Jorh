name: Build, Push & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: jorh-1
  REGION: us-central1
  IMAGE_PREFIX: us-central1-docker.pkg.dev/jorh-1/jorh

jobs:
  build-push-deploy:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            dockerfile: apps/api-gateway/Dockerfile
          - service: auth-service
            dockerfile: apps/auth-service/Dockerfile
          - service: links-service
            dockerfile: apps/links-service/Dockerfile
          - service: analytics-service
            dockerfile: apps/analytics-service/Dockerfile
          - service: redirect-service
            dockerfile: apps/redirect-service/Dockerfile
          - service: web
            dockerfile: apps/web/Dockerfile
          - service: dashboard
            dockerfile: apps/dashboard/Dockerfile
          - service: docs
            dockerfile: apps/docs/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@jorh-1.iam.gserviceaccount.com

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Resolve build args
        id: build-args
        run: |
          {
            echo 'value<<EOF'
            case "${{ matrix.service }}" in
              web)
                echo "VITE_API_URL=${{ vars.VITE_API_URL }}"
                echo "VITE_DASHBOARD_URL=${{ vars.VITE_DASHBOARD_URL }}"
                echo "VITE_DOCS_URL=${{ vars.VITE_DOCS_URL }}"
                ;;
              dashboard|docs)
                echo "VITE_API_URL=${{ vars.VITE_API_URL }}"
                ;;
            esac
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.build-args.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Deploy to Cloud Run
        if: github.event_name != 'pull_request'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ matrix.service }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
