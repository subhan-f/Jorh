server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Gzip — reduces JS/CSS/JSON transfer size by ~70%
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/javascript application/javascript
             application/json application/xml image/svg+xml font/woff2;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Long-lived cache for hashed static assets (JS/CSS chunks, fonts, images)
  location ~* \.(js|css|woff2?|ttf|otf|eot|ico|svg|png|jpg|jpeg|webp|gif)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Astro pages — short cache with revalidation (HTML is not content-hashed)
  location ~* \.html$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires 0;
  }

  # SPA / Astro fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
