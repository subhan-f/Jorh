steps:
  # Pull the previous image to use as a cache layer (allowed to fail on first build)
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - >-
        docker pull
        us-central1-docker.pkg.dev/${_PROJECT_ID}/cloud-run/jorh-api:cache
        || true

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/api/Dockerfile
      - --cache-from
      - us-central1-docker.pkg.dev/${_PROJECT_ID}/cloud-run/jorh-api:cache
      - -t
      - us-central1-docker.pkg.dev/${_PROJECT_ID}/cloud-run/jorh-api:${_TAG}
      - -t
      - us-central1-docker.pkg.dev/${_PROJECT_ID}/cloud-run/jorh-api:cache
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - us-central1-docker.pkg.dev/${_PROJECT_ID}/cloud-run/jorh-api

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - us-central1-docker.pkg.dev/${_PROJECT_ID}/cloud-run/jorh-api:${_TAG}
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - "8080"
      - --memory
      - "512Mi"
      - --cpu
      - "1"
      - --min-instances
      - "0"
      - --max-instances
      - "10"
      - --project
      - ${_PROJECT_ID}
      - --set-env-vars
      - >-
        FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID},
        FIREBASE_CLIENT_EMAIL=${_FIREBASE_CLIENT_EMAIL},
        WEB_URL=${_WEB_URL},
        APP_URL=${_APP_URL},
        ADMIN_EMAILS=${_ADMIN_EMAILS},
        NODE_ENV=production
      - --set-secrets
      - >-
        FIREBASE_PRIVATE_KEY=projects/${_PROJECT_ID}/secrets/jorh-firebase-private-key/versions/latest,
        INTERNAL_API_SECRET=projects/${_PROJECT_ID}/secrets/jorh-internal-api-secret/versions/latest

substitutions:
  _PROJECT_ID: "jorh-1"
  _REGION: us-central1
  _SERVICE: jorh-api
  _TAG: latest
  _FIREBASE_PROJECT_ID: "jorh-1"
  _FIREBASE_CLIENT_EMAIL: "firebase-adminsdk-fbsvc@jorh-1.iam.gserviceaccount.com"
  _WEB_URL: "https://jorh.net"
  _APP_URL: "https://app.jorh.net"
  _ADMIN_EMAILS: "info@subhanfarrakh.com"

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  diskSizeGb: 100

timeout: 1200s
