steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/dashboard/Dockerfile
      - -t
      - us-central1-docker.pkg.dev/${_PROJECT_ID}/cloud-run/jorh-dashboard:${_TAG}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/${_PROJECT_ID}/cloud-run/jorh-dashboard:${_TAG}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - us-central1-docker.pkg.dev/${_PROJECT_ID}/cloud-run/jorh-dashboard:${_TAG}
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - "8080"
      - --project
      - ${_PROJECT_ID}

substitutions:
  _PROJECT_ID: ""
  _REGION: us-central1
  _SERVICE: jorh-dashboard
  _TAG: latest

options:
  logging: CLOUD_LOGGING_ONLY
