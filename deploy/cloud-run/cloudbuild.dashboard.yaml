steps:
  # Pull the previous image to use as a cache layer (allowed to fail on first build)
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - >-
        docker pull
        us-central1-docker.pkg.dev/${_PROJECT_ID}/cloud-run/jorh-dashboard:cache
        || true

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/dashboard/Dockerfile
      - --cache-from
      - us-central1-docker.pkg.dev/${_PROJECT_ID}/cloud-run/jorh-dashboard:cache
      - --build-arg
      - "VITE_FIREBASE_API_KEY=${_VITE_FIREBASE_API_KEY}"
      - --build-arg
      - "VITE_FIREBASE_AUTH_DOMAIN=${_VITE_FIREBASE_AUTH_DOMAIN}"
      - --build-arg
      - "VITE_FIREBASE_PROJECT_ID=${_VITE_FIREBASE_PROJECT_ID}"
      - --build-arg
      - "VITE_FIREBASE_STORAGE_BUCKET=${_VITE_FIREBASE_STORAGE_BUCKET}"
      - --build-arg
      - "VITE_FIREBASE_MESSAGING_SENDER_ID=${_VITE_FIREBASE_MESSAGING_SENDER_ID}"
      - --build-arg
      - "VITE_FIREBASE_APP_ID=${_VITE_FIREBASE_APP_ID}"
      - --build-arg
      - "VITE_FIREBASE_MEASUREMENT_ID=${_VITE_FIREBASE_MEASUREMENT_ID}"
      - --build-arg
      - "VITE_API_URL=${_VITE_API_URL}"
      - --build-arg
      - "VITE_REDIRECT_BASE=${_VITE_REDIRECT_BASE}"
      - --build-arg
      - "VITE_POSTHOG_KEY=${_VITE_POSTHOG_KEY}"
      - --build-arg
      - "VITE_POSTHOG_HOST=${_VITE_POSTHOG_HOST}"
      - -t
      - us-central1-docker.pkg.dev/${_PROJECT_ID}/cloud-run/jorh-dashboard:${_TAG}
      - -t
      - us-central1-docker.pkg.dev/${_PROJECT_ID}/cloud-run/jorh-dashboard:cache
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - us-central1-docker.pkg.dev/${_PROJECT_ID}/cloud-run/jorh-dashboard

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - us-central1-docker.pkg.dev/${_PROJECT_ID}/cloud-run/jorh-dashboard:${_TAG}
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - "8080"
      - --memory
      - "256Mi"
      - --cpu
      - "1"
      - --min-instances
      - "0"
      - --max-instances
      - "10"
      - --project
      - ${_PROJECT_ID}

substitutions:
  _PROJECT_ID: "jorh-1"
  _REGION: us-central1
  _SERVICE: jorh-dashboard
  _TAG: latest
  _VITE_FIREBASE_API_KEY: "AIzaSyC6wAT24hANekwqZ-677OV9vxn7AmtZO1k"
  _VITE_FIREBASE_AUTH_DOMAIN: "jorh-1.firebaseapp.com"
  _VITE_FIREBASE_PROJECT_ID: "jorh-1"
  _VITE_FIREBASE_STORAGE_BUCKET: "jorh-1.appspot.com"
  _VITE_FIREBASE_MESSAGING_SENDER_ID: "599388754417"
  _VITE_FIREBASE_APP_ID: "1:599388754417:web:26d81b39960eed6700f450"
  _VITE_FIREBASE_MEASUREMENT_ID: "G-ZY059QLB4K"
  _VITE_API_URL: "https://jorh-api-599388754417.us-central1.run.app"
  _VITE_REDIRECT_BASE: "https://jorh-dashboard-599388754417.us-central1.run.app"
  _VITE_POSTHOG_KEY: ""
  _VITE_POSTHOG_HOST: ""

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  diskSizeGb: 100

timeout: 1200s
